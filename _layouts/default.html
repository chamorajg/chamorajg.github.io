<!doctype html>
<html lang="en">
{% assign p = site.data.portfolio %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ p.site.title }}</title>
  <meta name="description" content="{{ p.site.description }}">
  <meta name="author" content="{{ p.site.name }}">
  <link rel="canonical" href="{{ p.site.url }}{{ page.url | replace: 'index.html', '' }}">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ p.site.title }}">
  <meta property="og:description" content="{{ p.site.description }}">
  <meta property="og:url" content="{{ p.site.url }}{{ page.url | replace: 'index.html', '' }}">
  <meta property="og:image" content="{{ p.site.url }}/{{ p.site.profile_image }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ p.site.title }}">
  <meta name="twitter:description" content="{{ p.site.description }}">
  <meta name="twitter:image" content="{{ p.site.url }}/{{ p.site.profile_image }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ p.site.name }}",
    "jobTitle": "{{ p.site.role }}",
    "url": "{{ p.site.url }}",
    "email": "chanduiyer.raja@gmail.com",
    "sameAs": [
      "{{ p.site.github }}",
      "{{ p.site.linkedin }}"
    ],
    "knowsAbout": [
      "Robot learning",
      "Sim-to-real transfer",
      "Adaptive learning",
      "Continual learning",
      "Offline reinforcement learning",
      "World models",
      "Embodied AI"
    ],
    "alumniOf": {
      "@type": "CollegeOrUniversity",
      "name": "University of California, San Diego"
    },
    "publication": [
      {% assign verified_publications = p.publications | where: "verified", true %}
      {% for publication in verified_publications %}
      {
        "@type": "ScholarlyArticle",
        "name": {{ publication.title | jsonify }},
        "author": [
          {% for author in publication.authors %}
          { "@type": "Person", "name": {{ author | jsonify }} }{% unless forloop.last %},{% endunless %}
          {% endfor %}
        ],
        "isPartOf": {{ publication.venue | jsonify }}
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header class="site-header">
    <nav class="nav" aria-label="Primary navigation">
      <a class="nav__brand" href="{{ '/' | relative_url }}">{{ p.site.name }}</a>
      <div class="nav__links">
        <a href="#research">Research</a>
        <a href="#directions">Research Directions</a>
        <a href="#publications">Publications</a>
        <a href="#about">About</a>
        <a href="{{ p.site.cv_path }}">CV</a>
      </div>
      <div class="nav__social">
        <a href="{{ p.site.github }}" rel="noopener noreferrer">GitHub</a>
        <a href="{{ p.site.linkedin }}" rel="noopener noreferrer">LinkedIn</a>
        <a href="{{ p.site.email }}">Email</a>
      </div>
    </nav>
  </header>

  {{ content }}

  <footer class="site-footer">
    <p>&copy; {{ "now" | date: "%Y" }} {{ p.site.name }}</p>
    <div class="text-links">
      <a href="{{ p.site.cv_path }}">CV</a>
      <a href="{{ p.site.github }}" rel="noopener noreferrer">GitHub</a>
      <a href="{{ p.site.linkedin }}" rel="noopener noreferrer">LinkedIn</a>
      <a href="{{ p.site.email }}">Email</a>
    </div>
  </footer>
</body>
</html>
