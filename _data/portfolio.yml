research_vision:
  question: "How can robots remain reliable when deployment conditions differ from their training distribution?"
  body: "My research focuses on robust robot learning under distribution shift. I study how simulation, offline data, uncertainty-aware adaptation, and multimodal feedback can be combined to initialize policies efficiently and improve them from limited real-world experience. My long-term goal is to develop robots that adapt to new dynamics, observations, tasks, and embodiments without forgetting previously learned skills."
  pillars:
    - title: "Robust Sim-to-Real Transfer"
      body: "Develop policies that tolerate inaccuracies in dynamics, contact, latency, perception, and hardware interfaces."
    - title: "Adaptive and Continual Robot Learning"
      body: "Enable robots to detect distribution shift, adapt from limited real-world interaction, and acquire new skills without catastrophically forgetting prior capabilities."
    - title: "Data-Efficient Real-World Learning"
      body: "Use offline RL, world models, imitation learning, and pretrained multimodal models to reduce expensive real-robot interaction."

projects:
  - title: "Robust Sim-to-Real Manipulation"
    question: "How can policies trained in simulation retain precision under contact variation, hardware mismatch, latency, and imperfect observations?"
    description:
      - "Built end-to-end sim-to-real reinforcement-learning pipelines for object stacking and peg insertion on OpenArm, as well as free-grasp transfer on the Panthera-HT manipulation platform. The work covered simulation task design, contact-rich policy training, observation and action interface alignment, hardware integration, and real-robot evaluation."
    contribution: "Simulation task design, contact-rich policy training, observation/action interface alignment, hardware integration, and real-robot evaluation."
    highlights: []
