  - title: "Occlusion-Robust Ping-Pong Control"
    featured: true
    question: "How can a dynamic control policy remain stable when state observations are temporarily unavailable or noisy?"
    description:
      - "Developed and deployed a state-based sim-to-real controller for dynamic robotic ping-pong ball control. The system sustained continuous paddle-ball juggling on real hardware for 30 minutes without failure while maintaining and recovering closed-loop state estimates through temporary ball occlusions, observation noise, and timing-sensitive contacts."
    contribution: "State-based sim-to-real control, real-hardware deployment, and robustness evaluation under occlusion, observation noise, and timing-sensitive contacts."
    highlights:
      - "30 minutes uninterrupted"
      - "Real-robot deployment"
      - "Recovery through temporary occlusion"
    methods:
