directions:
  intro: "I am interested in pursuing the following questions during a PhD."
  items:
    - title: "Adaptive Domain Randomization"
      question: "Can a robot use real-world failures to identify which simulator parameters are incorrect and automatically update its randomization distribution?"
    - title: "Safe Offline-to-Online Adaptation"
      question: "Can uncertainty, value estimates, and distribution-shift detection determine when a deployed policy should adapt and how much real-world exploration is safe?"
    - title: "Continual Learning Across Tasks and Embodiments"
      question: "How can a robot acquire new manipulation skills, environments, and hardware embodiments while preserving previously learned behaviors?"

